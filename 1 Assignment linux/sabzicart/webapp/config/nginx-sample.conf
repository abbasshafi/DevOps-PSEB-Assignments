# ------------------------------------------------------------------
#  Sample web server configuration for SabziCart
#  Kept by Kamran as a reference. NOT the live configuration.
# ------------------------------------------------------------------

# How many worker processes to start.
# "auto" means one per CPU core.
worker_processes auto;

# Where to write errors.
error_log /var/log/nginx/error.log warn;

events {
    # Maximum connections per worker.
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    keepalive_timeout 65;

    # Hide the version number from attackers.
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;

    # Compression saves bandwidth for mobile customers.
    gzip on;
    # gzip_types text/plain application/json;

    server {
        listen 80;
        server_name sabzicart.example www.sabzicart.example;

        # Redirect everything to HTTPS.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name sabzicart.example;

        # Certificates (practice paths)
        ssl_certificate     /etc/ssl/sabzicart/fullchain.pem;
        ssl_certificate_key /etc/ssl/sabzicart/privkey.pem;

        root /var/www/sabzicart;
        index index.html;

        # Main website
        location / {
            try_files $uri $uri/ =404;
        }

        # Product images are cached for 7 days.
        location /images/ {
            expires 7d;
        }

        # The API is served by the app on port 8080.
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            # proxy_read_timeout 30s;
        }

        # Block the admin area from the internet.
        location /admin {
            deny all;
        }

        # Old WordPress probes: answer 404 quickly.
        location = /wp-login.php {
            return 404;
        }
    }
}
