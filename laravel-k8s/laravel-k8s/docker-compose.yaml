x-laravel: &laravel
  image: laravel-k8s:1.0
  build: .
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY}
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: laravel
    DB_USERNAME: laravel
    DB_PASSWORD: secret
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *laravel
    ports:
      - "8080:8080"
  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--tries=3"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine

volumes:
  mysql-data:
